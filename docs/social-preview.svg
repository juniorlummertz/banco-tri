<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Banco TRI e FinUp — prévia social do projeto</title>
  <desc id="desc">Identidade azul do Banco TRI e verde do FinUp com composição editorial e elementos abstratos de interface.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061b2b"/>
      <stop offset=".57" stop-color="#0b3352"/>
      <stop offset="1" stop-color="#072538"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#138fc5"/>
      <stop offset="1" stop-color="#075275"/>
    </linearGradient>
    <linearGradient id="finup" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#106b67"/>
      <stop offset="1" stop-color="#0d3c43"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5ad2f0" stop-opacity=".58"/>
      <stop offset="1" stop-color="#5ad2f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#00101c" flood-opacity=".38"/>
    </filter>
    <clipPath id="canvas"><rect width="1280" height="640"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1280" height="640" fill="url(#background)"/>
    <circle cx="1240" cy="60" r="400" fill="#0c5479" opacity=".16"/>
    <circle cx="956" cy="626" r="330" fill="#18a5b1" opacity=".1"/>
    <path d="M-90 574 640 95M17 671 751 192M457 785 1209 305" stroke="url(#beam)" stroke-width="2" opacity=".24"/>
    <path d="M0 605 H1280" stroke="#b5e9f4" stroke-opacity=".13"/>

    <!-- Brand mark mirrors the geometric TRI symbol used in the app. -->
    <g transform="translate(80 72)">
      <rect width="55" height="55" rx="15" fill="#068fc8" stroke="#8cdef4" stroke-opacity=".55"/>
      <path d="M18 19v17M28 14v27M38 22v13" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <text x="72" y="37" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" letter-spacing="-1.8" fill="#f7fcff">Banco TRI</text>
      <circle cx="265" cy="27" r="2.5" fill="#62d1e9"/>
      <text x="283" y="36" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" letter-spacing="-1.2" fill="#68dbcd">FinUp</text>
    </g>

    <text x="80" y="223" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" letter-spacing="3.1" fill="#78cce4">PROTÓTIPO ACADÊMICO</text>
    <text x="76" y="322" font-family="DejaVu Sans,sans-serif" font-size="75" font-weight="700" letter-spacing="-5" fill="#fff">Finanças em</text>
    <text x="76" y="407" font-family="DejaVu Sans,sans-serif" font-size="75" font-weight="700" letter-spacing="-5" fill="#58c6e8">movimento.</text>
    <rect x="80" y="446" width="53" height="3" rx="2" fill="#43cbb8"/>
    <text x="80" y="492" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#d0e3ed">Conta demonstrativa e organização</text>
    <text x="80" y="524" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#d0e3ed">financeira em uma experiência integrada.</text>
    <text x="80" y="590" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#91afbd">REACT  /  VITE  /  DADOS FICTÍCIOS</text>

    <!-- Editorial illustration of the two product areas, without inventing live data. -->
    <g filter="url(#shadow)">
      <rect x="714" y="120" width="490" height="335" rx="24" fill="#f8fbfd"/>
      <path d="M738 120h442a24 24 0 0 1 24 24v62H714v-62a24 24 0 0 1 24-24Z" fill="#e8f2f7"/>
      <circle cx="749" cy="162" r="7" fill="#91bacd"/>
      <circle cx="771" cy="162" r="7" fill="#91bacd" opacity=".55"/>
      <rect x="1053" y="150" width="119" height="22" rx="11" fill="#fff"/>
      <rect x="741" y="236" width="247" height="192" rx="18" fill="url(#bank)"/>
      <text x="761" y="270" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#fff">TRI<tspan fill="#64d4f0">.</tspan></text>
      <path d="M765 323h82M765 339h153" stroke="#d7f4fc" stroke-opacity=".65" stroke-width="7" stroke-linecap="round"/>
      <path d="M766 396h115" stroke="#d7f4fc" stroke-opacity=".4" stroke-width="6" stroke-linecap="round"/>
      <rect x="1014" y="242" width="158" height="14" rx="7" fill="#a6bbc8"/>
      <rect x="1014" y="272" width="111" height="11" rx="5" fill="#d5e3e9"/>
      <path d="M1018 368 1050 338 1082 352 1112 301 1146 321 1175 285" fill="none" stroke="#0d96be" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1018 368 1050 338 1082 352 1112 301 1146 321 1175 285v123h-157Z" fill="#0d96be" opacity=".08"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="898" y="370" width="308" height="189" rx="23" fill="url(#finup)" stroke="#56c6b7" stroke-opacity=".58"/>
      <circle cx="933" cy="409" r="15" fill="#34c9b3" opacity=".22"/>
      <path d="m925 411 6 5 11-14" fill="none" stroke="#8df3d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="958" y="418" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#fff">FinUp</text>
      <text x="928" y="457" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#c7ece4">Visão das suas finanças</text>
      <rect x="929" y="486" width="41" height="42" rx="6" fill="#64e1c5"/>
      <rect x="985" y="503" width="41" height="25" rx="6" fill="#48b9ae"/>
      <rect x="1041" y="472" width="41" height="56" rx="6" fill="#83ebce"/>
      <rect x="1097" y="494" width="41" height="34" rx="6" fill="#48b9ae"/>
      <rect x="1153" y="479" width="25" height="49" rx="6" fill="#83ebce"/>
    </g>
  </g>
</svg>
